[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-hubble-geometric-projection"
version = "1.0.0"
description = "Reproducible geometric projection audit of the Hubble-scale mapping within the GEO framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Leonel Hernan Torreblanca", email = "torreblancaleonel@gmail.com" }
]

keywords = [
  "GEO",
  "hidden geometry",
  "cosmology",
  "Hubble tension",
  "projection geometry",
  "reproducibility"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics"
]

dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8"
]

[project.urls]
Homepage = "https://github.com/LeoTorreblanca/GEO-Hubble-Geometric-Projection"
Repository = "https://github.com/LeoTorreblanca/GEO-Hubble-Geometric-Projection"
Issues = "https://github.com/LeoTorreblanca/GEO-Hubble-Geometric-Projection/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
